aid: google-cloud-service-mesh
name: Google Cloud Service Mesh
description: >-
  Google Cloud Service Mesh is Google's managed service mesh solution for GKE and supported GKE Enterprise environments,
  enabling secure, observable, and reliable communication between microservices. It provides a managed Istio control
  plane, Google Cloud-native service routing APIs, mTLS security, and built-in telemetry for distributed applications.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
